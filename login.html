<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background: #f3f4f6;

      overflow-x: hidden;
    }

    /* Login box */

    #login {
      width: 100%;
      max-width: 400px;

      background: white;

      padding: 32px;

      border-radius: 10px;

      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);

      animation: showLogin 0.5s ease;
    }

    @keyframes showLogin {

      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    #login h2 {
      text-align: center;

      color: #222;

      font-size: 26px;

      margin-bottom: 28px;
    }

    /* Inputs */

    #inputs label {
      display: block;

      color: #444;

      font-size: 14px;

      margin-bottom: 7px;
    }

    #inputs input {
      width: 100%;

      height: 45px;

      padding: 0 12px;

      margin-bottom: 18px;

      border: 1px solid #d6d6d6;

      border-radius: 6px;

      outline: none;

      font-size: 14px;

      transition: 0.2s;
    }

    #inputs input:focus {
      border-color: #222;

      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
    }

    /* Password */

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 45px !important;
    }

    #show-password {
      position: absolute;

      right: 12px;
      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      color: #777;

      cursor: pointer;

      font-size: 15px;
    }

    #show-password:hover {
      color: #222;
    }

    /* Forgot */

    .forgot {
      text-align: right;

      margin-top: -7px;

      margin-bottom: 18px;
    }

    .forgot a {
      color: #666;

      font-size: 12px;

      text-decoration: none;
    }

    .forgot a:hover {
      text-decoration: underline;
    }

    /* Login button */

    #login-button {
      width: 100%;

      height: 45px;

      border: none;

      border-radius: 6px;

      background: #222;

      color: white;

      font-size: 15px;

      cursor: pointer;

      transition: 0.2s;
    }

    #login-button:hover {
      background: #3b3b3b;
    }

    #login-button:active {
      transform: scale(0.98);
    }

    #login-button:disabled {
      opacity: 0.7;

      cursor: not-allowed;
    }

    /* Message */

    #message {
      min-height: 18px;

      margin-top: 12px;

      text-align: center;

      font-size: 13px;
    }

    /* Social login */

    #login-methods {
      margin-top: 25px;

      padding-top: 23px;

      border-top: 1px solid #eee;

      text-align: center;
    }

    #login-methods h4 {
      color: #777;

      font-size: 13px;

      font-weight: normal;

      margin-bottom: 15px;
    }

    .social-login {
      display: flex;

      gap: 10px;
    }

    .social-login a {
      flex: 1;

      height: 42px;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 8px;

      border: 1px solid #ddd;

      border-radius: 6px;

      background: white;

      color: #333;

      text-decoration: none;

      font-size: 13px;

      transition: 0.2s;
    }

    .social-login a:hover {
      background: #f7f7f7;

      border-color: #bbb;

      transform: translateY(-1px);
    }

    .social-login i {
      font-size: 16px;
    }

    /* Create account */

    #login-methods p {
      margin-top: 20px;

      color: #666;

      font-size: 13px;
    }

    #login-methods p a {
      color: #222;

      font-weight: bold;

      text-decoration: none;
    }

    #login-methods p a:hover {
      text-decoration: underline;
    }

    /* Mobile */

    @media (max-width: 450px) {

      #login {
        padding: 25px 20px;
      }

      .social-login {
        flex-direction: column;
      }

    }

  </style>

</head>


<body>


  <div id="login">

    <h2>
      Login
    </h2>


    <form id="login-form">

      <div id="inputs">

        <label for="email-input">
          Email:
        </label>

        <input
          type="email"
          id="email-input"
          placeholder="Write your email"
          autocomplete="email"
          required
        >


        <label for="password">
          Password:
        </label>


        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Write your password"
            minlength="6"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            id="show-password"
            aria-label="Show password"
          >

            <i class="fa-regular fa-eye"></i>

          </button>

        </div>

      </div>


      <div class="forgot">

        <a href="forget.html">
          Forgot password?
        </a>

      </div>


      <button
        type="submit"
        id="login-button"
      >

        <span id="button-text">
          Login
        </span>

        <i
          id="loading-icon"
          class="fa-solid fa-spinner fa-spin"
          style="display: none;"
        ></i>

      </button>


      <div id="message"></div>

    </form>


    <div id="login-methods">

      <h4>
        You can login with
      </h4>


      <div class="social-login">


        <!-- Google -->

        <a
          href="https://accounts.google.com/"
          target="_blank"
          rel="noopener noreferrer"
        >

          <i class="fa-brands fa-google"></i>

          Google

        </a>


        <!-- Facebook -->

        <a
          href="https://www.facebook.com/"
          target="_blank"
          rel="noopener noreferrer"
        >

          <i class="fa-brands fa-facebook-f"></i>

          Facebook

        </a>


      </div>


      <p>

        You don't have an account?

        <a href="sign-in.html">
          Create account
        </a>

      </p>

    </div>

  </div>


  <script>


    const loginForm =
      document.getElementById("login-form");

    const emailInput =
      document.getElementById("email-input");

    const passwordInput =
      document.getElementById("password");

    const showPassword =
      document.getElementById("show-password");

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("login-button");

    const buttonText =
      document.getElementById("button-text");

    const loadingIcon =
      document.getElementById("loading-icon");


    /* Show / Hide password */

    showPassword.addEventListener("click", function () {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";

        showPassword.innerHTML =
          '<i class="fa-regular fa-eye-slash"></i>';

      }

      else {

        passwordInput.type = "password";

        showPassword.innerHTML =
          '<i class="fa-regular fa-eye"></i>';

      }

    });


    /* Login */

    loginForm.addEventListener("submit", function (event) {

      event.preventDefault();


      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      /* Reset message */

      message.textContent = "";


      /* Check email */

      if (email === "") {

        message.textContent =
          "Please enter your email.";

        message.style.color = "#d33";

        emailInput.focus();

        return;

      }


      /* Check password */

      if (password === "") {

        message.textContent =
          "Please enter your password.";

        message.style.color = "#d33";

        passwordInput.focus();

        return;

      }


      /* Check password length */

      if (password.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        message.style.color = "#d33";

        passwordInput.focus();

        return;

      }


      /* Check credentials */

      const users =
        JSON.parse(
          localStorage.getItem("users")
        ) || [];

      const matchedUser =
        users.find(function (user) {

          return (
            user.email === email.toLowerCase() &&
            user.password === password
          );

        });


      if (!matchedUser) {

        message.textContent =
          "Incorrect email or password.";

        message.style.color = "#d33";

        return;

      }


      /* Loading */

      loginButton.disabled = true;

      buttonText.textContent =
        "Logging in...";

      loadingIcon.style.display =
        "inline-block";


      setTimeout(function () {


        /* Save email */

        localStorage.setItem(
          "userEmail",
          email
        );


        /* Save logged-in user */

        localStorage.setItem(
          "currentUser",
          JSON.stringify({
            id: matchedUser.id,
            name: matchedUser.name,
            email: matchedUser.email
          })
        );


        message.textContent =
          "Login successful!";

        message.style.color =
          "green";


        buttonText.textContent =
          "Success";


        loadingIcon.style.display =
          "none";


        /*
          Open main.html
        */

        setTimeout(function () {

          window.location.href =
            "main.html";

        }, 500);


      }, 1000);


    });

  </script>


</body>

</html>
